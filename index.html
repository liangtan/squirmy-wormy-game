<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Squirmy Wormy</title>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;}html,body{height:100%;background:#221b2e;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;overflow:hidden;}body{position:fixed;inset:0;width:100%;}#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}#game{display:block;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,0.45);touch-action:none;cursor:pointer;max-width:100%;max-height:100%;}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#4a3b2a;pointer-events:none;padding:22px;}.card{background:rgba(255,255,255,0.94);border:3px solid #4a3b2a;border-radius:22px;padding:20px 24px;box-shadow:0 10px 0 rgba(74,59,42,0.25);pointer-events:auto;max-width:340px;animation:pop 0.35s cubic-bezier(.2,1.4,.4,1);}@keyframes pop{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}h1{font-size:30px;margin-bottom:2px;color:#e85f9c;text-shadow:1px 1px 0 #fff;}.tag{font-size:13px;opacity:0.7;margin-bottom:12px;}.big-score{font-size:54px;font-weight:bold;line-height:1;margin:4px 0;}.sub{font-size:14px;opacity:0.8;margin-bottom:12px;}.label{font-size:12px;opacity:0.6;margin-top:-4px;}.hint{margin-top:10px;font-size:13px;opacity:0.65;}.hidden{display:none !important;}.sharebox{font-family:'Courier New',monospace;font-size:15px;background:#fff7ea;border:2px dashed #4a3b2a;border-radius:12px;padding:10px 12px;margin:10px 0;white-space:pre-wrap;line-height:1.5;}button{font-family:inherit;font-weight:bold;font-size:16px;color:#4a3b2a;background:#ffd23f;border:3px solid #4a3b2a;border-radius:14px;padding:10px 18px;margin:5px;cursor:pointer;box-shadow:0 4px 0 rgba(74,59,42,0.4);transition:transform .05s,box-shadow .05s;}button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,59,42,0.4);}button.ghost{background:#fff;}.skins{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px;}.swatch{width:38px;height:38px;border-radius:50%;border:3px solid #fff;cursor:pointer;position:relative;box-shadow:0 0 0 2px rgba(74,59,42,0.25);transition:transform .1s;}.swatch:hover{transform:scale(1.1);}.swatch.sel{box-shadow:0 0 0 3px #4a3b2a;transform:scale(1.12);}.swatch .eye{position:absolute;width:7px;height:7px;background:#fff;border-radius:50%;top:11px;}.swatch .eye.l{left:9px;}.swatch .eye.r{right:9px;}.swatch .eye::after{content:'';position:absolute;width:3px;height:3px;background:#3a2a2a;border-radius:50%;top:2px;left:2px;}@media (max-width:600px){#game{border-radius:0;box-shadow:none;}.overlay{padding:14px;}.card{max-width:300px;padding:18px 18px;}h1{font-size:26px;}.sub{font-size:13px;}}</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- Start screen -->
  <div id="readyScreen" class="overlay">
    <div class="card">
      <h1>🪱 Squirmy Wormy</h1>
      <div class="tag">Hold to pop up · Release to burrow</div>
      <div class="label">Pick Your Worm</div>
      <div class="skins" id="skinRow"></div>
      <div class="sub">Pop up to munch leaves 🍃, berries 🫐 &amp; honey 🍯<br>Grab a lemon 🍋 to make the birds scatter!<br>Greedy wormy grows long — and long wormy<br>can't hide all of itself 😅</div>
      <button id="startBtn">Squirm!</button>
    </div>
  </div>

  <!-- Game-over screen -->
  <div id="deadScreen" class="overlay hidden">
    <div class="card">
      <h1 id="deadTitle">Pecked!</h1>
      <div class="tag" id="dailyTag">Squirmy Wormy</div>
      <div class="big-score" id="finalScore">0</div>
      <div class="sub">Best: <span id="bestScore">0</span> · This Run</div>
      <div class="sharebox" id="shareBox"></div>
      <button id="copyBtn">Copy Result 📋</button>
      <button id="retryBtn" class="ghost">Squirm Again!</button>
      <div class="hint" id="copyHint">&nbsp;</div>
    </div>
  </div>
</div>
